# C depth degradation: full matrix
name: C_depth
task: C
fault_config: configs/C_depth.yaml
out_dir: results/C/runs
sequences: [office_easy_p004, office_hard_p004]
seeds: [0, 1, 2]
modes: [RGBD, IMU_RGBD]
include_clean: true
clean_modes: [IMU_MONOCULAR]   # "RGB+IMU" control, clean only
faults:
  invalid_pixels: [P00, P20, P50, P80]
  depth_noise: [N1, N2, N3, N4]
  outage: [O05, O10, O20]
  depth_off: [ALL]
run_timeout_s: 1800
runner_args: []
evaluate_args: ["--recover-err", "0.5"]   # B/C 统一恢复判据（PROJECT_PLAN 3.2 第 5 条）
